<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Santa Fe 2026</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#C8102E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* Layout: iOS 26 style for the phone — a red hero that fades into the page (title, Masculino/Femenino capsule, tournament chips on glass), inset-grouped cards, floating Liquid Glass tab bar. Tokens mirror the "Cardenal" design system. */
:root {
  --bg: #F2F2F7; --surface: #FFFFFF; --surface-2: #E6E6EB; --ink: #111114; --ink-2: #5C5C66; --hairline: #C9C9D0;
  --cardenal: #C8102E; --on-cardenal: #FFFFFF; --cardenal-ink: #B00D27;
  --win: #1E7A3B; --on-win: #FFFFFF; --draw: #D1D1D6; --on-draw: #111114; --loss: #2C2C30; --on-loss: #FFFFFF;
  --gold-ink: #8A5A00; --chrome: rgba(246, 246, 249, 0.86); --scrim: rgba(0, 0, 0, 0.36); --track: #E6E6EB;
  --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
  --font-display: "Barlow Condensed", "SF Pro Display", -apple-system, system-ui, sans-serif;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-6: 24px;
  --radius-sm: 8px; --radius-md: 24px; --radius-lg: 28px; --radius-pill: 999px;
  --tabbar-h: 64px; --bar-draw: #8E8E93;
  --hero-a: #A80C25; --hero-b: #C8102E; --on-hero: #FFFFFF; --on-hero-2: rgba(255, 255, 255, 0.84);
  --hero-glass: rgba(255, 255, 255, 0.16); --hero-edge: rgba(255, 255, 255, 0.34); --hero-sel: #FFFFFF; --hero-sel-ink: #B00D27;
  --glass: rgba(250, 250, 252, 0.72); --glass-edge: rgba(255, 255, 255, 0.75); --glass-hi: rgba(255, 255, 255, 0.9); --glass-shadow: rgba(20, 20, 30, 0.18); --lens: rgba(200, 16, 46, 0.11); --sf-tint: rgba(200, 16, 46, 0.08);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --surface: #1C1C1E; --surface-2: #2C2C2E; --ink: #F5F5F7; --ink-2: #A1A1AA; --hairline: #3A3A3E;
    --cardenal: #D7192F; --on-cardenal: #FFFFFF; --cardenal-ink: #FF6B78;
    --win: #3DD06B; --on-win: #04210D; --draw: #48484A; --on-draw: #F5F5F7; --loss: #E5E5EA; --on-loss: #111114;
    --gold-ink: #F2C14E; --chrome: rgba(18, 18, 20, 0.86); --scrim: rgba(0, 0, 0, 0.6); --track: #2C2C2E;
    --hero-a: #4E0711; --hero-b: #8A1020; --on-hero: #FFFFFF; --on-hero-2: rgba(255, 255, 255, 0.8);
    --hero-glass: rgba(255, 255, 255, 0.12); --hero-edge: rgba(255, 255, 255, 0.22); --hero-sel: #FFFFFF; --hero-sel-ink: #B00D27;
    --glass: rgba(38, 38, 42, 0.62); --glass-edge: rgba(255, 255, 255, 0.14); --glass-hi: rgba(255, 255, 255, 0.2); --glass-shadow: rgba(0, 0, 0, 0.5); --lens: rgba(255, 107, 120, 0.18); --sf-tint: rgba(255, 107, 120, 0.14);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --hero-a: #4E0711; --hero-b: #8A1020; --on-hero: #FFFFFF; --on-hero-2: rgba(255, 255, 255, 0.8);
  --hero-glass: rgba(255, 255, 255, 0.12); --hero-edge: rgba(255, 255, 255, 0.22); --hero-sel: #FFFFFF; --hero-sel-ink: #B00D27;
  --glass: rgba(38, 38, 42, 0.62); --glass-edge: rgba(255, 255, 255, 0.14); --glass-hi: rgba(255, 255, 255, 0.2); --glass-shadow: rgba(0, 0, 0, 0.5); --lens: rgba(255, 107, 120, 0.18); --sf-tint: rgba(255, 107, 120, 0.14);
  --bg: #000000; --surface: #1C1C1E; --surface-2: #2C2C2E; --ink: #F5F5F7; --ink-2: #A1A1AA; --hairline: #3A3A3E;
  --cardenal: #D7192F; --on-cardenal: #FFFFFF; --cardenal-ink: #FF6B78;
  --win: #3DD06B; --on-win: #04210D; --draw: #48484A; --on-draw: #F5F5F7; --loss: #E5E5EA; --on-loss: #111114;
  --gold-ink: #F2C14E; --chrome: rgba(18, 18, 20, 0.86); --scrim: rgba(0, 0, 0, 0.6); --track: #2C2C2E;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 15px; line-height: 1.35;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--chrome); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--cardenal-ink); outline-offset: 2px; }
.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.num { font-variant-numeric: tabular-nums; }
.view, .sec, .list, .match, .inner, .filters .wrap { grid-template-columns: minmax(0, 1fr); }
.view > *, .sec > *, .list > *, .match > *, .inner > * { min-width: 0; }

/* Top bar + filters */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--chrome); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-bottom: 0.5px solid var(--hairline); }
.tb-in { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 10px; padding-block: 10px; }
.tb-crest { height: 40px; width: auto; display: block; }
.tb-t { display: grid; min-width: 0; }
.tb-name { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 26px; line-height: 26px; letter-spacing: .5px; text-transform: uppercase; color: var(--ink); }
.tb-sub { font-size: 12px; line-height: 16px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tog { display: grid; grid-template-columns: 1fr 1fr; padding: 4px; border-radius: var(--radius-pill); background: var(--surface-2); border: 0.5px solid var(--hairline); }
.cloud { min-height: 32px; padding: 0 12px; border: 0; border-radius: var(--radius-pill); background: transparent; color: var(--ink-2); font-size: 13px; font-weight: 700; cursor: pointer; transition: background-color .2s ease, color .2s ease; }
.cloud[aria-pressed="true"] { background: var(--ink); color: var(--bg); box-shadow: 0 1px 4px rgba(0, 0, 0, .2); }
.filters2 { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--space-3); padding-block: var(--space-4); }
.seg2 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; border-radius: 16px; background: var(--surface); border: 0.5px solid var(--hairline); }
.seg2 button { min-height: 44px; border: 0; border-radius: 12px; background: transparent; color: var(--ink-2); font-size: 15px; font-weight: 700; cursor: pointer; transition: background-color .2s ease, color .2s ease; }
.seg2 button[aria-selected="true"] { background: var(--surface-2); color: var(--ink); }
.chips { display: flex; gap: var(--space-2); overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; min-height: 38px; padding: 0 16px; border-radius: var(--radius-pill); background: var(--surface); border: 0.5px solid var(--hairline); color: var(--ink); font-size: 14px; font-weight: 700; cursor: pointer; transition: background-color .2s ease, color .2s ease; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip:disabled { opacity: .4; cursor: default; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { .cloud, .chip, .seg2 button { transition: none; } }

/* Sections */
main { padding-bottom: calc(var(--tabbar-h) + 12px + env(safe-area-inset-bottom, 0px) + var(--space-6)); }
main .view { padding-top: 0; }
.view { display: grid; gap: var(--space-6); padding-top: var(--space-4); }
.sec { display: grid; gap: var(--space-2); min-width: 0; }
.cap { margin: 0 4px; font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: .5px; text-transform: uppercase; color: var(--ink-2); }
h2 { margin: 0; font-size: 22px; line-height: 28px; font-weight: 700; text-wrap: balance; }
.card { background: var(--surface); border-radius: var(--radius-lg); border: 0.5px solid var(--hairline); min-width: 0; overflow: hidden; }
.empty { padding: var(--space-6) var(--space-4); text-align: center; color: var(--ink-2); }

/* Season strip */
.strip { display: flex; gap: var(--space-2); overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 2px 16px; }
.strip::-webkit-scrollbar { display: none; }
.pill-card { flex: none; width: 210px; background: var(--surface); border: 0.5px solid var(--hairline); border-radius: var(--radius-md); padding: var(--space-3); display: grid; gap: 2px; }
.pill-card .pc-n { font-size: 13px; font-weight: 600; }
.pill-card .pc-r { font-size: 13px; color: var(--ink-2); }
.pill-card.champ .pc-r { color: var(--gold-ink); font-weight: 700; }
.pill-card .pc-b { font-size: 11px; font-weight: 600; letter-spacing: .4px; text-transform: uppercase; color: var(--ink-2); }

/* Match card */
.list { display: grid; gap: var(--space-3); }
.match { display: grid; gap: var(--space-2); width: 100%; text-align: left; background: var(--surface); border: 0.5px solid var(--hairline); border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); cursor: pointer; }
.match:active { background: var(--surface-2); }
.m-top { display: flex; align-items: center; gap: var(--space-2); min-width: 0; }
.m-comp { flex: 1; min-width: 0; font-size: 12px; line-height: 16px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.m-comp b { color: var(--ink); font-weight: 600; }
.tag { flex: none; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: var(--radius-pill); background: var(--surface-2); color: var(--ink); }
.tag.f { background: var(--cardenal); color: var(--on-cardenal); }
.res { flex: none; width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; font-size: 12px; font-weight: 700; }
.res.G { background: var(--win); color: var(--on-win); }
.res.E { background: var(--loss); color: var(--on-loss); }
.res.P { background: var(--cardenal); color: var(--on-cardenal); }
.teams { display: grid; gap: 6px; }
.trow { display: grid; grid-template-columns: 28px 1fr auto; align-items: center; gap: var(--space-2); }
.badge { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; font-weight: 700; letter-spacing: .2px; background: var(--surface-2); color: var(--ink-2); }
.badge.sf { background: var(--cardenal); color: var(--on-cardenal); }
.tn { font-size: 17px; line-height: 22px; font-weight: 500; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tn.w { font-weight: 700; }
.sc { font-family: var(--font-display); font-weight: 700; font-size: 26px; line-height: 26px; min-width: 22px; text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.sc.w { color: var(--ink); }
.m-pen { font-size: 12px; color: var(--ink-2); padding-left: 36px; }
.scorers { display: grid; gap: 2px; padding-left: 36px; font-size: 13px; line-height: 18px; }
.scorers .s-sf { color: var(--cardenal-ink); }
.scorers .s-op { color: var(--ink-2); }
.m-foot { display: flex; align-items: center; gap: var(--space-2); font-size: 13px; line-height: 18px; color: var(--ink-2); border-top: 0.5px solid var(--hairline); padding-top: var(--space-2); }
.m-foot span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chev { flex: none; width: 8px; height: 13px; }

/* Next match */
.next { background: var(--cardenal); color: var(--on-cardenal); border: 0; }
.next .m-comp, .next .m-comp b, .next .m-foot, .next .tn, .next .sc { color: var(--on-cardenal); }
.next .badge { background: rgba(255,255,255,.18); color: var(--on-cardenal); }
.next .badge.sf { background: var(--on-cardenal); color: var(--cardenal); }
.next .m-foot { border-top-color: rgba(255,255,255,.3); }
.next .count { font-family: var(--font-display); font-weight: 700; font-size: 22px; line-height: 24px; text-align: right; }
.next .count small { display: block; font-family: var(--font-ui); font-size: 11px; font-weight: 600; letter-spacing: .4px; text-transform: uppercase; }
.next.match:active { background: var(--cardenal); opacity: .9; }
.up-row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: var(--space-3); }

/* Partidos: Pasados / Hoy / Próximos */
.sb { overflow: hidden; }
.subtabs { display: grid; grid-template-columns: repeat(3, 1fr); border-bottom: 0.5px solid var(--hairline); }
.subtabs button { position: relative; border: 0; background: transparent; min-height: 52px; font-size: 17px; font-weight: 600; color: var(--ink-2); cursor: pointer; }
.subtabs button[aria-selected="true"] { color: var(--ink); font-weight: 700; }
.subtabs button[aria-selected="true"]::after { content: ""; position: absolute; left: 28%; right: 28%; bottom: 0; height: 3px; border-radius: 3px 3px 0 0; background: var(--cardenal); }
.mhead { display: flex; justify-content: space-between; gap: var(--space-2); padding: 10px var(--space-4); background: var(--surface-2); font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; color: var(--ink); }
.mhead span { font-weight: 600; color: var(--ink-2); letter-spacing: .3px; }
.srow { display: grid; gap: var(--space-2); width: 100%; padding: 14px var(--space-3) 16px; border: 0; background: transparent; text-align: center; color: var(--ink); }
button.srow { cursor: pointer; }
button.srow:active { background: var(--surface-2); }
.srow + .srow { border-top: 0.5px solid var(--hairline); }
.s-comp { font-size: 13px; line-height: 17px; color: var(--ink-2); text-wrap: balance; }
.s-main { display: grid; grid-template-columns: 90px 38px minmax(0, 1fr) 38px 90px; align-items: center; gap: 2px; }
.s-main.up { grid-template-columns: 90px minmax(0, 1fr) 90px; }
.s-team { display: grid; justify-items: center; gap: 5px; min-width: 0; }
.s-team.lg .badge { width: 44px; height: 44px; font-size: 13px; }
.crest { display: block; height: 46px; width: auto; margin-block: -1px; filter: drop-shadow(0 1px 1.5px rgba(0, 0, 0, .18)); }
.board .crest { height: 58px; margin-block: -5px; }
.s-tn { font-size: 13px; line-height: 16px; font-weight: 600; text-wrap: balance; overflow-wrap: break-word; max-width: 100%; }
.s-sc { font-family: var(--font-display); font-weight: 700; font-size: 46px; line-height: 46px; text-align: center; font-variant-numeric: tabular-nums; color: var(--ink); }
.s-sc.l { color: var(--ink-2); opacity: .6; }
.s-mid { display: grid; justify-items: center; gap: 4px; font-size: 16px; font-weight: 700; }
.s-mid small { font-size: 12px; line-height: 15px; font-weight: 500; color: var(--ink-2); }
.s-mid.up span { font-size: 15px; }
.s-mid.up small { font-size: 14px; font-weight: 700; color: var(--cardenal-ink); }
.s-goals { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3); font-size: 13px; line-height: 18px; padding: 0 var(--space-1); }
.s-goals .gl { text-align: left; }
.s-goals .gr { text-align: right; }
.s-goals .sf { color: var(--cardenal-ink); }
.s-goals .op { color: var(--ink-2); }
.s-venue { font-size: 13px; line-height: 18px; color: var(--ink-2); }
.s-empty { padding: var(--space-6) var(--space-4) var(--space-4); text-align: center; font-size: 15px; color: var(--ink-2); }
.s-note { padding: var(--space-3) var(--space-4); font-size: 13px; color: var(--ink-2); border-top: 0.5px solid var(--hairline); }

/* Compact rows (inset grouped) */
.rows > * + * { border-top: 0.5px solid var(--hairline); }
.row-i { display: grid; grid-template-columns: 1fr auto; gap: var(--space-3); align-items: center; padding: var(--space-3) var(--space-4); min-height: 44px; }
.row-i .t { font-size: 15px; font-weight: 600; min-width: 0; }
.row-i .sub { font-size: 13px; color: var(--ink-2); }
.row-i .v { font-size: 13px; color: var(--ink-2); text-align: right; }
button.row-i { width: 100%; text-align: left; border: 0; background: transparent; cursor: pointer; }
.rows > * + button.row-i { border-top: 0.5px solid var(--hairline); }

/* Tables */
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
th { font-size: 11px; font-weight: 600; letter-spacing: .4px; text-transform: uppercase; color: var(--ink-2); text-align: right; padding: var(--space-2) 6px; border-bottom: 0.5px solid var(--hairline); }
td { text-align: right; padding: 7px 6px; border-bottom: 0.5px solid var(--hairline); white-space: nowrap; }
th:first-child, td:first-child { text-align: right; width: 28px; padding-left: var(--space-3); color: var(--ink-2); }
th:nth-child(2), td:nth-child(2) { text-align: left; width: 99%; }
td:nth-child(2) { font-weight: 500; color: var(--ink); }
td:last-child, th:last-child { padding-right: var(--space-4); font-weight: 700; }
tr.sf td { background: var(--cardenal); color: var(--on-cardenal); font-weight: 700; }
tr.cut td { border-bottom: 1.5px dashed var(--ink-2); }
tbody tr:last-child td { border-bottom: 0; }
.tnote { margin: 0; padding: var(--space-3) var(--space-4); font-size: 13px; color: var(--ink-2); border-top: 0.5px solid var(--hairline); }
.status { font-size: 13px; color: var(--ink-2); margin: 0 4px; }
.status.champ { color: var(--gold-ink); font-weight: 700; }
.comp-head { display: grid; gap: 2px; margin: 0 4px; }
.out { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: var(--radius-pill); }
.out.ok { background: var(--win); color: var(--on-win); }
.out.ko { background: var(--loss); color: var(--on-loss); }
.out.el { background: var(--cardenal); color: var(--on-cardenal); }
.out.champ { background: var(--gold-ink); color: var(--surface); }
.out.wait { background: var(--surface-2); color: var(--ink); }

/* Standings: summary card + clean list */
.sumcard { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: center; padding: 18px; border-radius: var(--radius-lg); background: var(--cardenal); color: var(--on-cardenal); }
.sumcard .crest { height: 66px; margin: 0; }
.sum-big { font-family: var(--font-display); font-weight: 700; font-size: 46px; line-height: 44px; font-variant-numeric: tabular-nums; }
.sum-big small { font-family: var(--font-ui); font-size: 15px; font-weight: 600; opacity: .85; }
.sum-big .ord { font-size: .55em; vertical-align: .6em; margin-left: 1px; }
.sum-t { font-weight: 700; font-size: 15px; }
.sum-f { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.sum-f span { font-size: 12px; font-weight: 600; line-height: 16px; padding: 3px 9px; border-radius: var(--radius-pill); background: rgba(255, 255, 255, .18); border: 0.5px solid rgba(255, 255, 255, .38); }
.pt-h, .pt-r { display: grid; grid-template-columns: 18px 28px minmax(0, 1fr) 24px 24px 24px 24px 30px 28px; gap: 4px; align-items: center; padding: 0 14px 0 8px; font-variant-numeric: tabular-nums; }
.pt-h { height: 40px; font-size: 10.5px; font-weight: 700; letter-spacing: .3px; text-transform: uppercase; color: var(--ink-2); }
.pt-h span:nth-child(2) { grid-column: 2 / 4; }
.pt-h span:nth-child(n+3) { text-align: right; }
.pt-r { position: relative; min-height: 46px; font-size: 14px; }
.pt-r span:nth-child(n+4) { text-align: right; color: var(--ink-2); }
.pt-r .pts { color: var(--ink); font-weight: 800; font-size: 15px; }
.pt-r .pos { color: var(--ink-2); text-align: right; font-size: 13px; }
.pt-r .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pt-r .badge { width: 26px; height: 26px; font-size: 9px; margin: auto; }
.pt-r .crest { height: 30px; margin: auto; }
.pt-r + .pt-r::before { content: ""; position: absolute; top: 0; left: 58px; right: 0; border-top: 0.5px solid var(--hairline); }
.pt-r.in::after { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 0 3px 3px 0; background: var(--win); }
.pt-r.sf { background: var(--sf-tint); }

.pt-cut { display: flex; align-items: center; gap: 8px; padding: 4px 14px; font-size: 10.5px; font-weight: 700; letter-spacing: .4px; text-transform: uppercase; color: var(--ink-2); }
.pt-cut::before, .pt-cut::after { content: ""; flex: 1; border-top: 1.5px dashed var(--hairline); }

/* Record card */
.rec { padding: 18px; }

.rn.g { color: var(--win); }

/* Stats */
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-2); }

.kpi.red .n { color: var(--cardenal-ink); }

.track { height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; margin-top: 4px; }
.track i { display: block; height: 100%; background: var(--cardenal); border-radius: 3px; }
.track.alt i { background: var(--ink-2); }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2); }
.period { display: grid; gap: var(--space-2); padding: var(--space-3) var(--space-4) var(--space-4); }
.prow { display: grid; grid-template-columns: 52px 1fr 1fr; gap: var(--space-2); align-items: center; font-size: 13px; }
.prow .pl { color: var(--ink-2); font-variant-numeric: tabular-nums; }
.pbar { display: flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
.pbar i { display: block; height: 14px; border-radius: 4px; min-width: 2px; }
.pbar.for i { background: var(--cardenal); }
.pbar.ag i { background: var(--ink-2); }
.legend { display: flex; gap: var(--space-4); font-size: 12px; color: var(--ink-2); padding: var(--space-3) var(--space-4) 0; }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; background: var(--cardenal); }
.legend span.ag::before { background: var(--ink-2); }

/* Footer */
.foot { font-size: 12px; line-height: 17px; color: var(--ink-2); display: grid; gap: var(--space-1); padding: 0 4px; }

/* Tab bar: floating Liquid Glass capsule */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; pointer-events: none; padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 12px) max(16px, env(safe-area-inset-left, 0px)); }
.glass { pointer-events: auto; position: relative; max-width: 420px; height: var(--tabbar-h); margin: 0 auto; padding: 6px; display: grid; grid-template-columns: repeat(3, 1fr); border-radius: var(--radius-pill); background: var(--glass); border: 0.5px solid var(--glass-edge); -webkit-backdrop-filter: blur(24px) saturate(190%); backdrop-filter: blur(24px) saturate(190%); box-shadow: 0 12px 32px var(--glass-shadow), 0 2px 6px rgba(0, 0, 0, .06), inset 0 1px 0 var(--glass-hi), inset 0 -1px 1px rgba(0, 0, 0, .05); }
.glass::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: linear-gradient(180deg, rgba(255, 255, 255, .22), rgba(255, 255, 255, 0) 55%); }
.lens { position: absolute; top: 6px; bottom: 6px; left: 6px; width: calc((100% - 12px) / 3); border-radius: var(--radius-pill); background: var(--lens); box-shadow: inset 0 1px 0 var(--glass-hi), inset 0 0 0 0.5px var(--glass-edge); transform: translateX(calc(var(--i, 0) * 100%)); transition: transform .45s cubic-bezier(.3, 1.35, .45, 1); }
.glass button { position: relative; z-index: 1; border: 0; background: transparent; display: grid; place-items: center; align-content: center; gap: 2px; font-size: 11px; font-weight: 600; color: var(--ink); cursor: pointer; border-radius: var(--radius-pill); transition: color .2s ease, transform .15s ease; }
.glass button svg { width: 24px; height: 24px; }
.glass button:active { transform: scale(.94); }
.glass button[aria-current="page"] { color: var(--cardenal-ink); }
@media (prefers-reduced-motion: reduce) { .lens, .glass button { transition: none; } }

.scrim { position: fixed; inset: 0; z-index: 40; background: var(--scrim); }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-height: calc(100% - 40px - env(safe-area-inset-top, 0px)); overflow-y: auto; overscroll-behavior: contain; background: var(--bg); border-radius: var(--radius-lg) var(--radius-lg) 0 0; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + var(--space-6)); animation: up .28s cubic-bezier(.2,.8,.2,1); }

.tl { display: grid; }

.sbars { display: grid; gap: var(--space-3); padding: var(--space-4); }
.sbar .lab { display: grid; grid-template-columns: 1fr auto 1fr; font-size: 13px; align-items: baseline; }
.sbar .lab b { font-size: 15px; font-variant-numeric: tabular-nums; }

.sbar .lab span { color: var(--ink-2); text-align: center; }
.sbar .dual { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-top: 4px; }

.noscroll { overflow: hidden; }

  /* ---------- Estadísticas ---------- */
  function minuteNum(s) { var p = String(s).replace("'", "").split("+"); return Number(p[0]); }

      '</div><div class="card rows">' +
      '<div class="row-i"><div class="t">Goles por partido</div><div class="v num">' + (f / n).toFixed(2).replace(".", ",") + ' a favor · ' + (a / n).toFixed(2).replace(".", ",") + ' en contra</div></div>' +

    html += footer();
    el.innerHTML = html;
  }
  function kpi(k, n, cls) { return '<div class="kpi' + (cls ? " " + cls : "") + '"><span class="k">' + k + '</span><span class="n">' + n + '</span></div>'; }
  function scopeLabel() { return (state.b === "all" ? "Masculino y femenino" : state.b === "M" ? "Masculino" : "Femenino") + " · " + (state.k === "all" ? "todos los torneos" : KNAMES[state.k]); }

  function footer() {
    var u = pd(DATA.updated);
    return '<footer class="foot"><span>Actualizado el ' + u.da + ' de ' + MONL[u.mo - 1].toLowerCase() + ' de ' + u.y + '. Horas de Colombia.</span><span>Fuentes: ' + esc(DATA.sources.join(" · ")) + '.</span><span>Página de hinchas, no oficial. Sin relación con el club.</span></footer>';
  }

  /* ---------- Sheet ---------- */
  var lastFocus = null;
  function openSheet(id) {
    var m = DATA.matches.filter(function (x) { return x.id === id; })[0];
    if (!m) return;
    lastFocus = document.activeElement;
    var r = res(m);
    var ev = m.g.map(function (g) { return { min: g[0], n: minuteNum(g[0]), sf: g[1] === 1, kind: "g", who: g[2], ast: g[3], tag: g[4] }; })
      .concat((m.r || []).map(function (x) { return { min: x[0], n: minuteNum(x[0]), sf: x[1] === 1, kind: "r", who: x[2] }; }));
    function extra(s) { var p = String(s).replace("'", "").split("+"); return p[1] ? Number(p[1]) : 0; }
    ev.forEach(function (e) { e.k = e.n + extra(e.min) / 100; });
    ev.sort(function (x, y) { return x.k - y.k; });
    var hsRun = 0, asRun = 0;
    var tl = ev.map(function (e) {
      var det = "";
      if (e.kind === "g") {
        var homeGoal = (e.sf && isHome(m)) || (!e.sf && !isHome(m));
        if (homeGoal) hsRun++; else asRun++;
        var team = e.sf ? SF : opp(m);
        det = "Gol de " + esc(team) + " · " + hsRun + "-" + asRun + (e.tag === "pen" ? " · de penal" : "") + (e.tag === "og" ? " · en contra (autogol)" : "") + (e.ast ? " · asistencia de " + esc(e.ast) : "");
        return '<div class="ev' + (e.sf ? " sf" : "") + '"><span class="min">' + esc(e.min) + '</span><div><div class="who">' + esc(e.who) + '</div><div class="det">' + det + '</div></div></div>';
      }
      return '<div class="ev"><span class="min">' + esc(e.min) + '</span><div><div class="who"><span class="rc" aria-hidden="true"></span>' + esc(e.who) + '</div><div class="det">Tarjeta roja · ' + esc(e.sf ? SF : opp(m)) + '</div></div></div>';
    }).join("");
    var stats = "";
    if (m.s) {
      var L = [["pos", "Posesión", "%"], ["sh", "Remates", ""], ["sot", "Remates al arco", ""], ["co", "Córners", ""], ["fo", "Faltas", ""], ["ye", "Amarillas", ""], ["re", "Rojas", ""], ["sv", "Atajadas", ""], ["off", "Fueras de lugar", ""], ["pa", "Pases completos", ""]];
      var home = isHome(m);
      stats = L.filter(function (x) { return m.s[x[0]]; }).map(function (x) {
        var v = m.s[x[0]], hv = home ? v[0] : v[1], av = home ? v[1] : v[0], t = Math.max(hv + av, 0.01);
        return '<div class="sbar"><div class="lab"><b>' + String(hv).replace(".", ",") + x[2] + '</b><span>' + x[1] + '</span><b>' + String(av).replace(".", ",") + x[2] + '</b></div><div class="dual"><div><i style="width:' + (hv / t * 100).toFixed(1) + '%;background:' + (home ? "var(--cardenal)" : "var(--ink-2)") + '"></i></div><div><i style="width:' + (av / t * 100).toFixed(1) + '%;background:' + (home ? "var(--ink-2)" : "var(--cardenal)") + '"></i></div></div></div>';
      }).join("");
    }
    var hw = m.hs > m.as || (m.pen && m.pen[0] > m.pen[1]);
    var sub = [];
    if (m.pen) sub.push(penTxt(m));
    if (m.note) sub.push(esc(m.note));
    var html = '<div class="grab" aria-hidden="true"></div><div class="wrap"><div class="inner">' +
      '<div class="bar"><span class="cap" style="margin:0">' + esc(m.b === "F" ? "Femenino" : "Masculino") + '</span><button class="close" id="sheet-close">Cerrar</button></div>' +
      '<div><h2 id="sheet-title">' + esc(C[m.c].n) + '</h2><p class="status" style="margin:2px 0 0">' + esc(m.st) + ' · ' + esc(fmtDate(m.d)) + '</p></div>' +
      '<div class="card"><div class="board"><div class="side">' + mark(m.h) + '<span class="nm">' + esc(m.h) + '</span></div>' +
      '<div class="big"><span>' + m.hs + '</span><span class="dash">-</span><span>' + m.as + '</span></div>' +
      '<div class="side">' + mark(m.a) + '<span class="nm">' + esc(m.a) + '</span></div></div>' +
      '<div class="board-sub"><span class="res ' + r + '" style="display:inline-grid;vertical-align:middle;margin-right:6px">' + r + '</span>' + resWord(r) + (sub.length ? ' · ' + sub.join(" · ") : "") + '</div></div>' +
      '<section class="sec"><p class="cap">Goles' + ((m.r || []).length ? " y expulsiones" : "") + '</p><div class="card tl">' + (tl || '<div class="empty">Sin goles</div>') + '</div></section>' +
      (stats ? '<section class="sec"><p class="cap">Estadísticas</p><div class="card sbars"><div class="sbar"><div class="lab"><b>' + esc(m.h) + '</b><span></span><b>' + esc(m.a) + '</b></div></div>' + stats + '</div></section>' : "") +
      '<section class="sec"><p class="cap">Datos del partido</p><div class="card rows info">' +
      '<div class="row-i"><div class="t">Estadio</div><div class="v">' + esc(m.v) + '</div></div>' +
      '<div class="row-i"><div class="t">Fecha</div><div class="v">' + esc(fmtDate(m.d)) + (pd(m.d).t ? " (hora de Colombia)" : "") + '</div></div>' +
      (m.att ? '<div class="row-i"><div class="t">Asistencia</div><div class="v num">' + m.att.toLocaleString("es-CO") + ' espectadores</div></div>' : "") +
      '</div></section></div></div>';
    var sh = $("sheet");
    sh.innerHTML = html;
    sh.hidden = false; $("scrim").hidden = false;
    document.body.classList.add("noscroll");
    sh.scrollTop = 0;
    $("sheet-close").addEventListener("click", closeSheet);
    $("sheet-close").focus();
  }
  function closeSheet() {
    $("sheet").hidden = true; $("scrim").hidden = true;
    document.body.classList.remove("noscroll");
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }
  $("scrim").addEventListener("click", closeSheet);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !$("sheet").hidden) closeSheet(); });

  /* ---------- Controls ---------- */
  function syncControls() {
    ["M", "F"].forEach(function (b) { $("b-" + b).setAttribute("aria-pressed", String(state.b === b)); });
    ["all", "liga", "copa", "int"].forEach(function (k) {
      var btn = $("k-" + k);
      btn.setAttribute("aria-pressed", String(state.k === k));
      var has = k === "all" || ORDER.some(function (c) { return C[c].k === k && (state.b === "all" || C[c].b === state.b); });
      btn.disabled = !has;
    });
    ["partidos", "posiciones", "estadisticas"].forEach(function (t) {
      $("v-" + t).hidden = state.tab !== t;
      if (state.tab === t) $("t-" + t).setAttribute("aria-current", "page"); else $("t-" + t).removeAttribute("aria-current");
    });
    $("glass").style.setProperty("--i", String(["partidos", "posiciones", "estadisticas"].indexOf(state.tab)));
    $("title").textContent = TITLES[state.tab];
    $("tb-sub").textContent = "Temporada 2026 · " + (state.b === "F" ? "Femenino" : "Masculino");
    $("subseg").hidden = state.tab !== "partidos";
  }
  function render() {
    if (state.k !== "all" && !ORDER.some(function (c) { return C[c].k === state.k && (state.b === "all" || C[c].b === state.b); })) state.k = "all";
    syncControls();
    if (state.tab === "partidos") renderPartidos();
    else if (state.tab === "posiciones") renderPosiciones();
    else renderEstadisticas();
    try { localStorage.setItem("sf26", JSON.stringify({ b: state.b, k: state.k, sub: state.sub })); } catch (e) {}
  }
  document.querySelectorAll("[data-b]").forEach(function (btn) { btn.addEventListener("click", function () { state.b = btn.getAttribute("data-b"); render(); }); });
  document.querySelectorAll("[data-k]").forEach(function (btn) { btn.addEventListener("click", function () { state.k = btn.getAttribute("data-k"); render(); }); });
  document.querySelectorAll("[data-tab]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      state.tab = btn.getAttribute("data-tab");
      try { history.replaceState(null, "", "#" + state.tab); } catch (e) {}
      render(); window.scrollTo(0, 0);
    });
  });
  document.addEventListener("click", function (e) {
    var sb = e.target.closest("[data-sub]");
    if (sb) { state.sub = sb.getAttribute("data-sub"); render(); return; }
    var t = e.target.closest("[data-id]");
    if (t) openSheet(t.getAttribute("data-id"));
  });
  window.addEventListener("hashchange", function () { var h = location.hash.replace("#", ""); if (TITLES[h] && h !== state.tab) { state.tab = h; render(); } });
  if (!state.sub) {
    var td = todayCO();
    state.sub = DATA.matches.concat(DATA.upcoming).some(function (x) { return x.d && x.d.slice(0, 10) === td && x.b === state.b; }) ? "hoy" : "pasados";
  }
  render();
})();
</script>

</body></html>
